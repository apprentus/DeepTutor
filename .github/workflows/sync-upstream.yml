name: Sync upstream and build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Notify start
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "🔄 *[CI/CD]* New merge on main — build starting..."}'

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: AppTeamit1
          password: ${{ secrets.SYNC_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('deeptutor/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/apprentus/deeptutor:latest
            ghcr.io/apprentus/deeptutor:${{ steps.version.outputs.version }}

      - name: Notify build done
        if: success()
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "✅ *[CI/CD]* Build complete — image v${{ steps.version.outputs.version }} ready."}'

      - name: Notify build failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "❌ *[CI/CD]* Build FAILED! Check GitHub Actions."}'

  deploy-staging:
    needs: build
    runs-on: [self-hosted, encore-staging]

    steps:
      - name: Deploy to staging
        run: |
          cd /opt/deeptutor
          docker compose -f docker-compose.ghcr.yml down
          docker pull ghcr.io/apprentus/deeptutor:latest
          sed -i "s|ghcr.io/apprentus/deeptutor:.*|ghcr.io/apprentus/deeptutor:latest|" docker-compose.ghcr.yml
          docker compose -f docker-compose.ghcr.yml up -d

      - name: Clean up old Docker images
        if: always()
        run: |
          docker images ghcr.io/apprentus/deeptutor --format "{{.ID}} {{.CreatedAt}}" | \
            sort -k2 -r | \
            awk '{print $1}' | \
            tail -n +3 | \
            xargs -r docker rmi -f 2>/dev/null || true
          docker image prune -f
          docker builder prune -f --filter "until=24h" || true

      - name: Notify staging done
        if: success()
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "✅ *[STAGING]* Deployed and ready for testing — https://encore-staging.apprentus.dev"}'

      - name: Notify staging failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "❌ *[STAGING]* Deploy FAILED! Check GitHub Actions."}'
